<!doctype html>
<html lang="es">
<head>

<title>ChampionTile — preview</title>

<body>
<div class="pv" style="align-items:stretch">
  <div class="champ-tile side-blue"><span class="champ-portrait" aria-hidden="true">O</span><span class="champ-name">Orianna</span></div>
  <div class="champ-tile side-blue picked"><span class="champ-portrait" aria-hidden="true">S</span><span class="champ-name">Syndra</span><span class="pill pill-side">Elegido</span></div>
  <div class="champ-tile side-blue used"><span class="champ-portrait" aria-hidden="true">A</span><span class="champ-name">Ahri</span><span class="pill pill-neutral">Usado en P1</span></div>
  <div class="champ-tile side-red"><span class="champ-portrait" aria-hidden="true">S</span><span class="champ-name">Sylas</span></div>
  <div class="champ-tile side-red picked"><span class="champ-portrait" aria-hidden="true">L</span><span class="champ-name">LeBlanc</span><span class="pill pill-side">Elegido</span></div>
  <div class="champ-tile side-red used"><span class="champ-portrait" aria-hidden="true">A</span><span class="champ-name">Akali</span><span class="pill pill-neutral">Usado en P2</span></div>
</div>
