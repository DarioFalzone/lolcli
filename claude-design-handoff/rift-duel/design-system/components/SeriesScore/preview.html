<!-- @dsCard group="Serie" height=260 subtitle="Versión estática (HTML + CSS)" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SeriesScore — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap">
</head>
<body>
<div class="pv-col">
  <div class="series-score" role="group" aria-label="Marcador: Quex 1, Mingo 1. Partida 3 en juego">
    <div class="series-side side-blue">
      <div class="series-player"><span class="side-tag">Lado azul</span><span class="series-name">Quex</span></div>
      <span class="series-wins">1</span>
    </div>
    <div class="series-mid">
      <span class="series-format">Mejor de 3</span>
      <ol class="series-games"><li class="game-pip won side-blue"><b>P1</b>Quex</li><li class="game-pip won side-red"><b>P2</b>Mingo</li><li class="game-pip live"><b>P3</b>En juego</li></ol>
    </div>
    <div class="series-side side-red">
      <span class="series-wins">1</span>
      <div class="series-player"><span class="side-tag">Lado rojo</span><span class="series-name">Mingo</span></div>
    </div>
  </div>
  <div class="series-score" role="group" aria-label="Marcador: Quex 0, Mingo 0">
    <div class="series-side side-blue">
      <div class="series-player"><span class="side-tag">Lado azul</span><span class="series-name">Quex</span></div>
      <span class="series-wins">0</span>
    </div>
    <div class="series-mid">
      <span class="series-format">Mejor de 3</span>
      <ol class="series-games"><li class="game-pip"><b>P1</b>Pendiente</li><li class="game-pip"><b>P2</b>Pendiente</li><li class="game-pip"><b>P3</b>Pendiente</li></ol>
    </div>
    <div class="series-side side-red">
      <span class="series-wins">0</span>
      <div class="series-player"><span class="side-tag">Lado rojo</span><span class="series-name">Mingo</span></div>
    </div>
  </div>
</div>
</body>
</html>
