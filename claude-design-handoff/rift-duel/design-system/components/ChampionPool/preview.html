<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ChampionPool — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap">
</head>
<body>
<div class="pv-grid-2">
  <section class="champ-pool side-blue" aria-label="Pool de Quex">
    <header class="champ-pool-head"><span class="side-tag">Lado azul</span><h3>Pool de Quex</h3><span class="champ-pool-count">3 de 5 disponibles</span></header>
    <div class="champ-pool-grid">
      <div class="champ-tile side-blue used"><span class="champ-portrait" aria-hidden="true">A</span><span class="champ-name">Ahri</span><span class="pill pill-neutral">Usado en P1</span></div>
      <div class="champ-tile side-blue"><span class="champ-portrait" aria-hidden="true">Y</span><span class="champ-name">Yasuo</span></div>
      <div class="champ-tile side-blue used"><span class="champ-portrait" aria-hidden="true">Z</span><span class="champ-name">Zed</span><span class="pill pill-neutral">Usado en P2</span></div>
      <div class="champ-tile side-blue picked"><span class="champ-portrait" aria-hidden="true">S</span><span class="champ-name">Syndra</span><span class="pill pill-side">Elegido</span></div>
      <div class="champ-tile side-blue"><span class="champ-portrait" aria-hidden="true">O</span><span class="champ-name">Orianna</span></div>
    </div>
  </section>
  <section class="champ-pool side-red" aria-label="Pool de Mingo">
    <header class="champ-pool-head"><span class="side-tag">Lado rojo</span><h3>Pool de Mingo</h3><span class="champ-pool-count">3 de 5 disponibles</span></header>
    <div class="champ-pool-grid">
      <div class="champ-tile side-red used"><span class="champ-portrait" aria-hidden="true">V</span><span class="champ-name">Viktor</span><span class="pill pill-neutral">Usado en P1</span></div>
      <div class="champ-tile side-red used"><span class="champ-portrait" aria-hidden="true">A</span><span class="champ-name">Akali</span><span class="pill pill-neutral">Usado en P2</span></div>
      <div class="champ-tile side-red picked"><span class="champ-portrait" aria-hidden="true">L</span><span class="champ-name">LeBlanc</span><span class="pill pill-side">Elegido</span></div>
      <div class="champ-tile side-red"><span class="champ-portrait" aria-hidden="true">S</span><span class="champ-name">Sylas</span></div>
      <div class="champ-tile side-red"><span class="champ-portrait" aria-hidden="true">K</span><span class="champ-name">Katarina</span></div>
    </div>
  </section>
</div>
</body>
</html>
