<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GameResult — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap">
</head>
<body>
<div class="pv-col" style="max-width:760px">
  <article class="game-result">
    <header class="game-result-head">
      <h3 class="game-result-title">Partida 1</h3>
      <span class="win-cond decided">First Blood · <span class="win-cond-time">06:42</span></span>
    </header>
    <div class="game-result-body">
      <div class="result-side side-blue winner">
        <span class="champ-portrait" aria-hidden="true">A</span>
        <div class="result-who"><span class="side-tag">Lado azul</span><strong>Quex</strong><span class="result-champ">Ahri</span></div>
        <span class="pill pill-gold">Ganó</span>
      </div>
      <div class="result-side side-red loser">
        <span class="champ-portrait" aria-hidden="true">V</span>
        <div class="result-who"><span class="side-tag">Lado rojo</span><strong>Mingo</strong><span class="result-champ">Viktor</span></div>
      </div>
    </div>
    <footer class="game-result-foot"><span>Serie</span><b>1-0</b></footer>
  </article>
</div>
</body>
</html>
