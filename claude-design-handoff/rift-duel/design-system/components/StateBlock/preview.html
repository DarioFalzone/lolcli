<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>StateBlock — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap">
</head>
<body>
<div class="pv-grid-2">
  <div class="state-block">
    <span class="icon" aria-hidden="true">—</span>
    <div class="title">Pool sin cargar</div>
    <div class="hint">Faltan los 5 campeones de Mingo.</div>
  </div>
  <div class="state-block error">
    <span class="icon" aria-hidden="true">×</span>
    <div class="title">No se pudo guardar</div>
    <div class="hint">El resultado de la Partida 2 no quedó registrado.</div>
  </div>
  <div class="skeleton" style="height:64px" aria-hidden="true"></div>
  <div class="skeleton" style="height:64px" aria-hidden="true"></div>
</div>
</body>
</html>
