<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PlayerCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap">
</head>
<body>
<div class="pv-grid-2">
  <article class="player-card side-blue">
    <header class="player-card-head"><span class="side-tag">Lado azul</span></header>
    <h3 class="player-name">Quex</h3>
    <dl class="player-stats">
      <div><dt>Serie</dt><dd>1</dd></div>
      <div><dt>Pick</dt><dd>Syndra</dd></div>
      <div><dt>Disponibles</dt><dd>3 de 5</dd></div>
    </dl>
  </article>
  <article class="player-card side-red">
    <header class="player-card-head"><span class="side-tag">Lado rojo</span></header>
    <h3 class="player-name">Mingo</h3>
    <dl class="player-stats">
      <div><dt>Serie</dt><dd>1</dd></div>
      <div><dt>Pick</dt><dd>LeBlanc</dd></div>
      <div><dt>Disponibles</dt><dd>3 de 5</dd></div>
    </dl>
  </article>
  <article class="player-card side-blue loser">
    <header class="player-card-head"><span class="side-tag">Lado azul</span></header>
    <h3 class="player-name">Quex</h3>
    <dl class="player-stats">
      <div><dt>Serie</dt><dd>1</dd></div>
      <div><dt>Pick</dt><dd>Syndra</dd></div>
      <div><dt>Disponibles</dt><dd>2 de 5</dd></div>
    </dl>
  </article>
  <article class="player-card side-red winner">
    <header class="player-card-head"><span class="side-tag">Lado rojo</span><span class="pill pill-gold">Campeón</span></header>
    <h3 class="player-name">Mingo</h3>
    <dl class="player-stats">
      <div><dt>Serie</dt><dd>2</dd></div>
      <div><dt>Pick</dt><dd>LeBlanc</dd></div>
      <div><dt>Disponibles</dt><dd>2 de 5</dd></div>
    </dl>
  </article>
</div>
</body>
</html>
