<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle Tier List — Patch 26.09</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="loader">Cargando jungle meta...</div>
    </div>

    <!-- Templates -->
    <template id="tpl-overview">
      <header class="hero">
        <div class="hero-row">
          <span class="hero-eyebrow">SKILLCAPPED</span>
          <span class="hero-patch">PATCH <span data-bind="patch"></span></span>
        </div>
        <h1 class="hero-title">TIER LIST</h1>
        <div class="hero-bottom">
          <div class="hero-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="64" height="64" fill="currentColor">
              <path d="M32 4 L26 22 L18 16 L22 30 L10 28 L20 38 L8 44 L24 44 L18 56 L30 48 L32 60 L34 48 L46 56 L40 44 L56 44 L44 38 L54 28 L42 30 L46 16 L38 22 Z"/>
            </svg>
          </div>
          <div class="hero-meta">
            <span class="hero-role">| JUNGLE</span>
            <span class="hero-updated">Updated <span data-bind="date_updated"></span></span>
          </div>
        </div>
      </header>

      <main class="overview">
        <aside class="sidebar">
          <section class="cat cat--op">
            <h2 class="cat-title"><span class="cat-icon">⚡</span> OVERPOWERED</h2>
            <div class="cat-list" data-bind="overpowered"></div>
          </section>
          <section class="cat cat--lowelo">
            <h2 class="cat-title"><span class="cat-icon">🎯</span> LOW ELO PICKS</h2>
            <div class="cat-list" data-bind="low_elo_picks"></div>
          </section>
          <section class="cat cat--bans">
            <h2 class="cat-title"><span class="cat-icon">🚫</span> RECOMMENDED BANS</h2>
            <div class="cat-list" data-bind="bans"></div>
          </section>
        </aside>

        <section class="tier-grid">
          <div class="tier-tabs" role="tablist">
            <button class="tier-tab active" data-tier="ALL" role="tab">All</button>
            <button class="tier-tab tier-tab--s" data-tier="S" role="tab">S</button>
            <button class="tier-tab tier-tab--a" data-tier="A" role="tab">A</button>
            <button class="tier-tab tier-tab--b" data-tier="B" role="tab">B</button>
            <button class="tier-tab tier-tab--c" data-tier="C" role="tab">C</button>
          </div>
          <div class="tier-rows" data-bind="tier_rows"></div>
        </section>
      </main>
    </template>

    <template id="tpl-champion-detail">
      <header class="detail-hero">
        <a class="back-link" href="#overview">← Back to tier list</a>
        <div class="detail-hero-bg" data-bind="splash_bg"></div>
        <div class="detail-hero-content">
          <div class="detail-portrait">
            <img data-bind="portrait_src" data-bind-attr="src" alt="" />
          </div>
          <div class="detail-info">
            <span class="detail-eyebrow">▸ JUNGLE  |  TIER LIST  |  PATCH <span data-bind="patch"></span></span>
            <h1 class="detail-name" data-bind="display_name"></h1>
            <p class="detail-reason" data-bind="reason_text"></p>
          </div>
          <div class="detail-tier-badge" data-bind="tier_badge"></div>
        </div>
      </header>

      <main class="detail-body">
        <section class="detail-stats">
          <div class="stat"><span class="stat-label">WIN RATE</span><span class="stat-value" data-bind="winrate"></span></div>
          <div class="stat"><span class="stat-label">PICK RATE</span><span class="stat-value" data-bind="pickrate"></span></div>
          <div class="stat"><span class="stat-label">BAN RATE</span><span class="stat-value" data-bind="banrate"></span></div>
        </section>

        <section class="detail-builds">
          <h2 class="section-title">⌃ CORE BUILDS</h2>
          <div class="builds-list" data-bind="builds"></div>
        </section>

        <section class="detail-rune">
          <h2 class="section-title">🎯 KEYSTONE RUNE</h2>
          <p class="rune-name" data-bind="rune_name"></p>
          <p class="rune-tree" data-bind="rune_tree"></p>
        </section>

        <section class="detail-playstyle">
          <h2 class="section-title">PLAYSTYLE</h2>
          <p data-bind="playstyle"></p>
        </section>
      </main>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
