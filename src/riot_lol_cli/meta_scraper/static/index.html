<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard de Meta de Soporte — Visualiza la tier list, winrates, pickrates y builds óptimas de soportes en League of Legends">
    <title>Meta Soporte — LoL CLI</title>

    <!-- Google Fonts (mismo stack del Draft Advisor) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Design System (reutilizado del Draft Advisor) -->
    <link rel="stylesheet" href="/design-system/tokens.css">
    <link rel="stylesheet" href="/design-system/compat-spa.css">
    <link rel="stylesheet" href="/design-system/components.css">

    <!-- Estilos específicos del Meta Scraper -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="app-shell" id="app-shell">
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="header-logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
                    <path d="M20 4L36 13V27L20 36L4 27V13L20 4Z" stroke="url(#hGrad)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M20 10L30 16V28L20 34L10 28V16L20 10Z" fill="url(#hFill)" opacity="0.2"/>
                    <circle cx="20" cy="22" r="5" fill="url(#hCore)" opacity="0.6"/>
                    <defs>
                        <linearGradient id="hGrad" x1="4" y1="4" x2="36" y2="36">
                            <stop stop-color="#c89b3c"/>
                            <stop offset="1" stop-color="#0ac8b9"/>
                        </linearGradient>
                        <linearGradient id="hFill" x1="10" y1="10" x2="30" y2="34">
                            <stop stop-color="#c89b3c"/>
                            <stop offset="1" stop-color="#0ac8b9"/>
                        </linearGradient>
                        <linearGradient id="hCore" x1="15" y1="17" x2="25" y2="27">
                            <stop stop-color="#e4c870"/>
                            <stop offset="1" stop-color="#0ac8b9"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="header-text">
                <h1 class="header-title">Meta LoL</h1>
                <p class="header-subtitle">Tier List - Soporte - ADC - Jungla</p>
            </div>
            <!-- Tabs de rol -->
            <nav class="role-tabs" id="role-tabs">
                <button class="role-tab role-tab--active" data-role="support" onclick="switchRole('support')">Soporte</button>
                <button class="role-tab" data-role="adc" onclick="switchRole('adc')">ADC</button>
                <button class="role-tab" data-role="jungle" onclick="switchRole('jungle')">Jungla</button>
            </nav>
        </div>
        <div class="header-right">
            <span class="patch-badge" id="patch-badge">—</span>
            <span class="scrape-timestamp" id="scrape-timestamp">Sin datos</span>
            <button class="btn-scrape" id="btn-scrape" onclick="triggerScrape()" aria-label="Actualizar datos">
                <svg class="btn-scrape-icon" id="scrape-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
                </svg>
                <span class="btn-scrape-text" id="scrape-text">Actualizar</span>
            </button>
        </div>
    </header>

    <!-- Stats rápidos -->
    <div class="quick-stats" id="quick-stats">
        <div class="stat-card">
            <span class="stat-value" id="stat-total">—</span>
            <span class="stat-label">Campeones</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="stat-sources">—</span>
            <span class="stat-label">Fuentes</span>
        </div>
        <div class="stat-card stat-card--gold">
            <span class="stat-value" id="stat-best-wr">—</span>
            <span class="stat-label" id="stat-best-name">Mejor WR</span>
        </div>
        <div class="stat-card stat-card--cyan">
            <span class="stat-value" id="stat-most-picked">—</span>
            <span class="stat-label" id="stat-picked-name">Más pickeado</span>
        </div>
    </div>

    <!-- Filtros -->
    <div class="filter-bar">
        <div class="filter-group">
            <label class="filter-label">Vista</label>
            <div class="source-filters" id="source-filters">
                <button class="source-pill source-pill--active" data-source="total" onclick="switchSource('total')">Total</button>
            </div>
        </div>
        <div class="filter-group">
            <label class="filter-label">Filtrar por Tier</label>
            <div class="tier-filters" id="tier-filters">
                <button class="tier-pill tier-pill--active" data-tier="all" onclick="filterByTier('all')">Todos</button>
                <button class="tier-pill tier-pill--s" data-tier="S" onclick="filterByTier('S')">S</button>
                <button class="tier-pill tier-pill--a" data-tier="A" onclick="filterByTier('A')">A</button>
                <button class="tier-pill tier-pill--b" data-tier="B" onclick="filterByTier('B')">B</button>
                <button class="tier-pill tier-pill--c" data-tier="C" onclick="filterByTier('C')">C</button>
            </div>
        </div>
        <div class="filter-group">
            <label class="filter-label">Buscar</label>
            <div class="search-wrapper">
                <input type="search" id="champion-search" class="search-input" placeholder="Buscar campeón..." oninput="filterBySearch(this.value)" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <!-- Tier List Table -->
    <main class="tier-list-container">
        <!-- Estado vacío -->
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 8L52 18V46L32 56L12 46V18L32 8Z" stroke="url(#eGrad)" stroke-width="1.5" stroke-linejoin="round"/>
                    <circle cx="32" cy="32" r="8" fill="url(#eFill)" opacity="0.3"/>
                    <defs>
                        <linearGradient id="eGrad" x1="12" y1="8" x2="52" y2="56">
                            <stop stop-color="#c89b3c" stop-opacity="0.5"/>
                            <stop offset="1" stop-color="#0ac8b9" stop-opacity="0.5"/>
                        </linearGradient>
                        <linearGradient id="eFill" x1="24" y1="24" x2="40" y2="40">
                            <stop stop-color="#c89b3c"/>
                            <stop offset="1" stop-color="#0ac8b9"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <p class="empty-title">Sin datos de meta</p>
            <p class="empty-sub">Presiona <strong>Actualizar</strong> para scrapear datos de LoLalytics, OP.GG y U.GG</p>
        </div>



        <!-- Tabla de tier list -->
        <table class="tier-table" id="tier-table" style="display: none;">
            <thead>
                <tr>
                    <th class="th-rank">#</th>
                    <th class="th-champion">Campeón</th>
                    <th class="th-tier">Tier</th>
                    <th class="th-stat">Win Rate</th>
                    <th class="th-stat">Pick Rate</th>
                    <th class="th-stat">Ban Rate</th>
                    <th class="th-climb th-stat">Climb</th>
                    <th class="th-sources">Fuentes</th>
                </tr>
            </thead>
            <tbody id="tier-table-body">
            </tbody>
        </table>
        <!-- Columna climb_score solo visible en modo ADC -->
        <style>
            .th-climb, .td-climb { display: none; }
            body.role-adc .th-climb, body.role-adc .td-climb { display: table-cell; }
        </style>
    </main>

    <!-- Panel de detalle (lateral) -->
    <aside class="detail-panel" id="detail-panel" style="display: none;">
        <button class="detail-close" onclick="closeDetail()" aria-label="Cerrar detalle">&times;</button>
        <div class="detail-content" id="detail-content"></div>
    </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
