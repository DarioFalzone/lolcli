<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADC Draft Advisor — League of Legends</title>
    <meta name="description" content="AI-powered ADC pick recommendation engine for League of Legends ranked draft. Get expert-level champion suggestions based on your team composition.">
    <link rel="stylesheet" href="/static/styles.css?v=2">
</head>
<body>
<div class="app">
    <!-- Header -->
    <header class="header">
        <h1>ADC Draft Advisor</h1>
        <p class="subtitle">Multi-factor scoring engine for optimal marksman selection</p>
        <span class="patch-badge" id="patch-badge">Loading...</span>
    </header>

    <!-- Main grid: Draft input + Config -->
    <div class="main-grid">
        <!-- Left: Draft Board -->
        <div class="card">
            <div class="card-header">
                <h2><span class="icon">&#9876;</span> Draft Board</h2>
            </div>
            <div class="card-body">
                <!-- Allies -->
                <div class="team-section">
                    <div class="team-label ally">&#9650; Allied Team (your side)</div>
                    <div class="champion-slots" id="ally-slots">
                        <div class="champion-slot" data-team="ally" data-index="0" onclick="openChampionPicker('ally', 0)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="ally" data-index="1" onclick="openChampionPicker('ally', 1)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="ally" data-index="2" onclick="openChampionPicker('ally', 2)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="ally" data-index="3" onclick="openChampionPicker('ally', 3)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot disabled" style="opacity:0.3;pointer-events:none;">
                            <span class="slot-placeholder" style="font-size:0.6rem;color:var(--gold);">ADC</span>
                        </div>
                    </div>
                </div>

                <!-- Enemies -->
                <div class="team-section">
                    <div class="team-label enemy">&#9660; Enemy Team</div>
                    <div class="champion-slots" id="enemy-slots">
                        <div class="champion-slot" data-team="enemy" data-index="0" onclick="openChampionPicker('enemy', 0)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="enemy" data-index="1" onclick="openChampionPicker('enemy', 1)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="enemy" data-index="2" onclick="openChampionPicker('enemy', 2)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="enemy" data-index="3" onclick="openChampionPicker('enemy', 3)">
                            <span class="slot-placeholder">+</span>
                        </div>
                        <div class="champion-slot" data-team="enemy" data-index="4" onclick="openChampionPicker('enemy', 4)">
                            <span class="slot-placeholder">+</span>
                        </div>
                    </div>
                </div>

                <!-- Context -->
                <div class="context-row">
                    <div class="context-group">
                        <label>Pick Position</label>
                        <select id="pick-position">
                            <option value="blind">Blind Pick</option>
                            <option value="early">Early Rotation</option>
                            <option value="late" selected>Late / Counter</option>
                        </select>
                    </div>
                    <div class="context-group">
                        <label>Queue Type</label>
                        <select id="queue-type">
                            <option value="ranked_solo" selected>Ranked Solo</option>
                            <option value="ranked_flex">Ranked Flex</option>
                            <option value="clash">Clash</option>
                            <option value="normal">Normal</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Pool & Config -->
        <div class="card">
            <div class="card-header">
                <h2><span class="icon">&#9733;</span> Champion Pool</h2>
            </div>
            <div class="card-body">
                <div class="pool-toggle" id="pool-toggle">
                    <button class="active" data-mode="unrestricted" onclick="setPoolMode('unrestricted')">Best Theoretical</button>
                    <button data-mode="pool_preferred" onclick="setPoolMode('pool_preferred')">Pool Preferred</button>
                    <button data-mode="pool_only" onclick="setPoolMode('pool_only')">Pool Only</button>
                </div>

                <div id="pool-config" style="display:none;">
                    <div class="pool-champions" id="pool-champions"></div>
                    <button class="pool-add-btn" onclick="openChampionPicker('pool', -1)">+ Add ADC to pool</button>

                    <div style="margin-top:16px;">
                        <label style="font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);display:block;margin-bottom:6px;">Comfort Scores</label>
                        <div id="comfort-sliders"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recommend Button -->
    <div class="recommend-section">
        <button class="recommend-btn" id="recommend-btn" onclick="getRecommendation()">
            Recommend ADC
        </button>
    </div>

    <!-- Results -->
    <div class="results-section" id="results-section">
        <!-- Draft Analysis Summary -->
        <div class="draft-summary" id="draft-summary"></div>

        <!-- Top Pick -->
        <div class="top-pick-card" id="top-pick-card"></div>

        <!-- Alternatives -->
        <div class="card" style="margin-top:16px;">
            <div class="card-header">
                <h2><span class="icon">&#9881;</span> Alternatives</h2>
            </div>
            <div class="card-body">
                <div class="alternatives-grid" id="alternatives-grid"></div>
            </div>
        </div>
    </div>
</div>

<!-- Champion Picker Modal -->
<div class="modal-overlay" id="champion-modal">
    <div class="modal">
        <div class="modal-header">
            <input type="text" id="champion-search" placeholder="Search champion..." oninput="filterChampions(this.value)" autofocus>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="role-filters" id="role-filters">
            <button class="role-filter active" data-role="all" onclick="filterByRole('all')">All</button>
            <button class="role-filter" data-role="Top" onclick="filterByRole('Top')">Top</button>
            <button class="role-filter" data-role="Jungle" onclick="filterByRole('Jungle')">Jungle</button>
            <button class="role-filter" data-role="Mid" onclick="filterByRole('Mid')">Mid</button>
            <button class="role-filter" data-role="Bot" onclick="filterByRole('Bot')">Bot</button>
            <button class="role-filter" data-role="Support" onclick="filterByRole('Support')">Support</button>
        </div>
        <div class="champion-grid" id="champion-grid"></div>
    </div>
</div>

<script src="/static/app.js?v=2"></script>
</body>
</html>
