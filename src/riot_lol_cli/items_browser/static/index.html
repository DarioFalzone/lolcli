<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Items Browser — League of Legends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-row">
        <span class="hero-eyebrow">RIOT LOL CLI</span>
        <span class="hero-version" data-bind="version">—</span>
      </div>
      <h1 class="hero-title">ITEMS</h1>
      <p class="hero-subtitle">Catalogo completo · EN + ES · agrupado y filtrable</p>
    </header>

    <section class="controls">
      <div class="search-wrap">
        <input
          type="search"
          id="search-input"
          placeholder="Buscar por nombre (EN o ES)..."
          autocomplete="off"
        />
        <div class="lang-toggle" role="radiogroup">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="es">ES</button>
        </div>
      </div>

      <div class="filter-row">
        <label class="checkbox">
          <input type="checkbox" id="show-deprecated" />
          <span>Mostrar items obsoletos</span>
        </label>
        <span class="counts" data-bind="counts"></span>
      </div>

      <div class="group-tabs" id="group-tabs"></div>
    </section>

    <main class="catalog">
      <div class="items-grid" id="items-grid">
        <div class="loader">Cargando catalogo de items...</div>
      </div>
    </main>

    <div class="modal" id="item-modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-content" id="modal-content"></div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
