<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/esports/favicon.svg" type="image/svg+xml" />
  <title>Esports Research - LOLCLI</title>
  <meta name="theme-color" content="#07111f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/design-system/tokens.css?v=2" />
  <link rel="stylesheet" href="/design-system/components.css?v=2" />
  <link rel="stylesheet" href="/design-system/patterns.css?v=2" />
  <link rel="stylesheet" href="/esports/app.css?v=1" />
</head>
<body data-page="overview">
  <header class="topbar">
    <a class="hub-link" href="http://localhost:8080/">LOLCLI Hub</a>
    <nav class="nav-links" aria-label="Esports Research">
      <a href="/esports/">Overview</a>
      <a href="/esports/drafts.html">Drafts</a>
      <a href="/esports/teams.html">Teams</a>
      <a href="/esports/players.html">Players</a>
      <a href="/esports/counterpicks.html">Counterpicks</a>
      <a href="/esports/tournaments.html">Tournaments</a>
    </nav>
  </header>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">PRO-STAGE COCKPIT</p>
        <h1>ESPORTS RESEARCH</h1>
        <p class="hero-copy">Drafts, comfort picks and counterpick signals from historical public sources.</p>
      </div>
      <div class="hero-mark" aria-hidden="true">ER</div>
    </section>
    <section class="stat-strip" id="stat-strip"></section>
    <section class="grid two">
      <article class="panel">
        <div class="panel-head"><h2>Sources</h2><span id="sources-pill" class="pill pill-neutral">loading</span></div>
        <div id="sources-list" class="stack"></div>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>Coverage</h2><span id="coverage-pill" class="pill pill-neutral">loading</span></div>
        <div id="coverage-list" class="stack"></div>
      </article>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Gaps</h2><span class="pill pill-gold">visible</span></div>
      <div id="gaps-list" class="stack"></div>
    </section>
  </main>
  <script src="/design-system/scroll-to-top.js"></script>
  <script src="/esports/app.js?v=1"></script>
</body>
</html>
